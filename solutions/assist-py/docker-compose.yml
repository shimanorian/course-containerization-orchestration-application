services:
  db:
    image: postgres:15
    container_name: yamaleeva-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - yamaleeva-db-data:/var/lib/postgresql/data
    networks:
      - yamaleeva-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yamaleeva-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - yamaleeva-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: yamaleeva-assistant
    environment:
      APP_OWNER: ${APP_OWNER}
      APP_SECRET: ${APP_SECRET}
      CACHE_TTL: ${CACHE_TTL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${APP_PORT}:8083"
    volumes:
      - ./config:/app/config:ro
    networks:
      - yamaleeva-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  yamaleeva-db-data:
    name: yamaleeva-db-data

networks:
  yamaleeva-net:
    name: yamaleeva-net
    driver: bridge