apiVersion: apps/v1
kind: Deployment
metadata:
  name: yamaleeva-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yamaleeva-redis
  template:
    metadata:
      labels:
        app: yamaleeva-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
