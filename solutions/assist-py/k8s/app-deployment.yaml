apiVersion: apps/v1
kind: Deployment
metadata:
  name: yamaleeva-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yamaleeva-app
  template:
    metadata:
      labels:
        app: yamaleeva-app
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          envFrom:
            - configMapRef:
                name: yamaleeva-app-config
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                sleep 2
              done
      containers:
        - name: app
          image: yamaleeva-assist-py:lab5
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: yamaleeva-app-config
            - secretRef:
                name: yamaleeva-app-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
